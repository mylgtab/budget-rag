name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install deps
        run: python -m pip install -q -r requirements.txt
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: build index
        run: python scripts/ingest.py --docs data/sample_docs
      - name: eval (offline)
        run: python scripts/eval.py --set data/eval_set.jsonl --k 3

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: install
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q coverage
      - name: measure
        run: |
          python -m coverage run --source=src/budget_rag -m unittest discover -s tests
          python -m coverage report -m
      - name: gate (>= 80%)
        run: python -m coverage report --fail-under=80
