name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install deps
        run: python -m pip install -q -r requirements.txt
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: build index
        run: python scripts/ingest.py --docs data/sample_docs
      - name: eval (offline)
        run: python scripts/eval.py --set data/eval_set.jsonl --k 3

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: install
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q coverage
      - name: measure
        run: |
          python -m coverage run --source=src/budget_rag -m unittest discover -s tests
          python -m coverage report -m
      - name: gate (>= 80%)
        run: python -m coverage report --fail-under=80

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t budget-rag:ci .
      - name: run container
        run: docker run -d --name rag -p 8000:8000 budget-rag:ci
      - name: wait healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs rag; exit 1
      - name: smoke query
        run: |
          curl -sS -X POST http://127.0.0.1:8000/query             -H 'Content-Type: application/json'             -d '{"question":"ETag 和 Last-Modified 哪个更精确？"}' | head -c 500
      - name: logs on failure
        if: failure()
        run: docker logs rag
