<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>budget-rag · 成本感知检索演示</title>
<style>
  :root { --bg:#0f1218; --card:#171c25; --fg:#e6e9ef; --muted:#8b93a7; --accent:#6aa6ff; --ok:#68d391; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.7 -apple-system,"Segoe UI",system-ui,sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin-bottom: 26px; }
  .card { background: var(--card); border:1px solid #232a36; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  textarea { width:100%; min-height:76px; background:#0d1015; color:var(--fg); border:1px solid #2a3240;
             border-radius: 8px; padding: 12px; font: inherit; resize: vertical; }
  .row { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap: wrap; }
  input[type=number], input[type=password] { background:#0d1015; color:var(--fg); border:1px solid #2a3240;
             border-radius:8px; padding:9px 10px; width:130px; font: inherit; }
  button { background: var(--accent); color:#08111f; border:0; border-radius:8px;
           padding:10px 18px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .answer { white-space: pre-wrap; font-size:16px; }
  .meta { display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin-top:10px; }
  .meta b { color: var(--ok); font-weight:600; }
  .ctx { color: var(--muted); font-size:13px; max-height: 220px; overflow:auto; white-space: pre-wrap;
         border-top:1px dashed #2a3240; margin-top:12px; padding-top:10px; }
  code { background:#0d1015; padding:1px 6px; border-radius:5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>budget-rag</h1>
  <div class="sub">成本感知的检索：简单问题走便宜路径，难题才升级。下面的数字来自服务端真实账单。</div>

  <div class="card">
    <textarea id="q" placeholder="问点什么，比如：ETag 和 Last-Modified 哪个更精确？"></textarea>
    <div class="row">
      <label>token 预算 <input id="tokens" type="number" value="300" min="50" step="50"></label>
      <input id="token" type="password" placeholder="API token（如已启用）" style="width:230px">
      <button id="go">提问</button>
    </div>
  </div>

  <div class="card" id="out" style="display:none">
    <div class="answer" id="answer"></div>
    <div class="meta" id="meta"></div>
    <div class="ctx" id="ctx"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
$("go").addEventListener("click", async () => {
  const q = $("q").value.trim();
  if (!q) return;
  $("go").disabled = true;
  $("out").style.display = "block";
  $("answer").textContent = "检索中…";
  const headers = { "Content-Type": "application/json" };
  const tok = $("token").value.trim();
  if (tok) headers["Authorization"] = "Bearer " + tok;
  try {
    const r = await fetch("/v1/query", {
      method: "POST", headers,
      body: JSON.stringify({ question: q, ctx_tokens: Number($("tokens").value) || 300 }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      $("answer").textContent = r.status === 401 ? "需要 token：请填写右上角输入框"
        : r.status === 429 ? "触发限流，稍后再试" : "请求失败：" + (err.detail || r.status);
      $("meta").textContent = ""; $("ctx").textContent = "";
      return;
    }
    const d = await r.json();
    const t = d.trace || {};
    $("answer").textContent = d.answer;
    $("meta").innerHTML = [
      `路径 <b>${t.path}</b>`, `索引 <b>${t.store}</b>`,
      `成本 <b>¥${(t.cost_rmb ?? 0).toFixed(6)}</b>`,
      `上下文 <b>${t.context_tokens}</b> tok`, `耗时 <b>${Math.round(t.latency_ms)}</b> ms`,
      t.billed ? "账单：真实" : "账单：估算",
    ].join(" · ");
    $("ctx").textContent = (t.docs || []).join("  ");
  } catch (e) {
    $("answer").textContent = "网络错误：" + e.message;
  } finally {
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
