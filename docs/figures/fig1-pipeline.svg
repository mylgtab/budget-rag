<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"
     font-family="system-ui,'Microsoft YaHei',sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#3b6fb6"/>
  </marker>
  <marker id="arrd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#8a8a8a"/>
  </marker>
</defs>
<rect width="1000" height="380" fill="white"/>

<!-- 顶部：语料与双索引 -->
<rect x="350" y="0" width="130" height="50" rx="10" fill="#f2f7ff" stroke="#9db8dd"/>
<text x="415" y="19" font-size="13" fill="#1d3c66" text-anchor="middle">语料</text>
<text x="415" y="37" font-size="11.5" fill="#4a6a92" text-anchor="middle">双索引：句级 / 块</text>
<line x1="415" y1="50" x2="415" y2="66" stroke="#3b6fb6" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- 主链 -->
<rect x="20" y="70" width="130" height="60" rx="10" fill="#f2f7ff" stroke="#3b6fb6"/>
<text x="85" y="96" font-size="14" fill="#12283f" text-anchor="middle">问题 q</text>
<text x="85" y="115" font-size="11.5" fill="#4a6a92" text-anchor="middle">用户请求</text>

<rect x="185" y="70" width="130" height="60" rx="10" fill="#f2f7ff" stroke="#3b6fb6"/>
<text x="250" y="96" font-size="14" fill="#12283f" text-anchor="middle">路由</text>
<text x="250" y="115" font-size="11.5" fill="#4a6a92" text-anchor="middle">预算 B → 档位</text>

<rect x="350" y="70" width="130" height="60" rx="10" fill="#f2f7ff" stroke="#3b6fb6"/>
<text x="415" y="96" font-size="14" fill="#12283f" text-anchor="middle">检索</text>
<text x="415" y="115" font-size="11.5" fill="#4a6a92" text-anchor="middle">BM25·向量·混合</text>

<rect x="515" y="70" width="130" height="60" rx="10" fill="#fff6e8" stroke="#cf8a33"/>
<text x="580" y="96" font-size="13.5" fill="#5a3a12" text-anchor="middle">门控：γ &lt; τ ?</text>
<text x="580" y="115" font-size="11.5" fill="#8a6130" text-anchor="middle">τ 由影子价格 λ 解出</text>

<rect x="680" y="70" width="140" height="60" rx="10" fill="#eaf6ee" stroke="#4f9463"/>
<text x="750" y="96" font-size="14" fill="#173f26" text-anchor="middle">预算取块</text>
<text x="750" y="115" font-size="11.5" fill="#3f6e4e" text-anchor="middle">按 g/c 累到 B 停</text>

<rect x="845" y="70" width="135" height="60" rx="10" fill="#f2f7ff" stroke="#3b6fb6"/>
<text x="912" y="96" font-size="14" fill="#12283f" text-anchor="middle">生成</text>
<text x="912" y="115" font-size="11.5" fill="#4a6a92" text-anchor="middle">答案 + Trace</text>

<!-- 主链箭头 -->
<line x1="150" y1="100" x2="181" y2="100" stroke="#3b6fb6" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="315" y1="100" x2="346" y2="100" stroke="#3b6fb6" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="480" y1="100" x2="511" y2="100" stroke="#3b6fb6" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="645" y1="100" x2="676" y2="100" stroke="#3b6fb6" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="662" y="90" font-size="11" fill="#3b6fb6" text-anchor="middle">否</text>
<line x1="820" y1="100" x2="841" y2="100" stroke="#3b6fb6" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- 门控 → 改写 -->
<line x1="570" y1="130" x2="570" y2="221" stroke="#cf8a33" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="580" y="170" font-size="11" fill="#8a6130">是（γ &lt; τ）</text>
<rect x="500" y="225" width="130" height="60" rx="10" fill="#fff6e8" stroke="#cf8a33"/>
<text x="565" y="251" font-size="14" fill="#5a3a12" text-anchor="middle">查询改写</text>
<text x="565" y="270" font-size="11.5" fill="#8a6130" text-anchor="middle">原问题 + 改写词</text>

<!-- 改写 → 取块（折线） -->
<path d="M630,255 L662,255 L662,100 L676,100" fill="none" stroke="#cf8a33" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- 第二跳（虚线） -->
<rect x="790" y="225" width="190" height="60" rx="10" fill="#fafafa" stroke="#8a8a8a" stroke-dasharray="6 4"/>
<text x="885" y="251" font-size="13.5" fill="#333" text-anchor="middle">第二跳（可选）</text>
<text x="885" y="270" font-size="11.5" fill="#666" text-anchor="middle">问模型还缺什么，再检索</text>
<path d="M745,130 L745,255 L786,255" fill="none" stroke="#8a8a8a" stroke-width="1.5"
      stroke-dasharray="6 4" marker-end="url(#arrd)"/>
<text x="752" y="200" font-size="11" fill="#8a8a8a">预算允许时</text>
<path d="M885,285 L885,335 L400,335 L400,134" fill="none" stroke="#8a8a8a" stroke-width="1.5"
      stroke-dasharray="6 4" marker-end="url(#arrd)"/>
<text x="640" y="328" font-size="11" fill="#8a8a8a">补充查询回到检索</text>

<!-- 注释：动作的成本与收益 -->
<text x="758" y="156" font-size="11" fill="#3f6e4e">c(a) · g(a | S)</text>
</svg>
